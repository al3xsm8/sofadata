services:
  postgres:
    image: postgres:17-alpine
    container_name: sofadata-postgres
    environment:
      POSTGRES_DB: sofadata
      POSTGRES_USER: sofadata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo app/backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sofadata_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofadata -d sofadata"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sofadata_postgres_data:
    name: sofadata_postgres_data
